<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutomateQuery Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101a2a; --panel-2:#15233a; --text:#f4f7fb; --muted:#8ca1b9; --accent:#5eead4; --border:#25364d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    header { padding:24px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:16px; align-items:center; }
    main { max-width:1200px; margin:0 auto; padding:24px 28px 60px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:24px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:0 14px 34px rgba(0,0,0,.18); }
    .card h2 { margin:0 0 10px; font-size:18px; }
    .card p { margin:0; color:var(--muted); line-height:1.5; }
    .stat { font-size:32px; font-weight:700; margin-top:10px; }
    .muted { color:var(--muted); font-size:13px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .actions a, .actions button { border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:10px 12px; border-radius:999px; cursor:pointer; }
    pre { white-space:pre-wrap; word-break:break-word; background:#050b12; border:1px solid var(--border); border-radius:12px; padding:14px; overflow:auto; font-size:12px; color:#dce8f7; }
    .list { margin:0; padding-left:18px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AutomateQuery Dashboard</h1>
      <div class="muted">Live summaries from reports and NLP review data.</div>
    </div>
    <div class="actions">
      <a href="/learning-cycle">Learning Cycle</a>
      <a href="/question-bank">Question Bank</a>
      <a href="/nlp-review">NLP Review</a>
    </div>
  </header>
  <main>
    <section class="grid" id="summaryCards"></section>
    <section class="card">
      <h2>Learning cycle summary</h2>
      <pre id="summaryText">Loading…</pre>
    </section>
    <section class="card">
      <h2>Latest queue snapshot</h2>
      <div id="queueList"></div>
    </section>
  </main>
  <script>
    async function loadDashboard() {
      const res = await fetch('/api/dashboard/summary');
      const data = await res.json();
      const cards = document.getElementById('summaryCards');
      cards.innerHTML = '';
      const stats = [
        ['Diagnosis', data.counts?.diagnosis ?? 0],
        ['Candidate queries', data.counts?.candidate_queries ?? 0],
        ['Expected zero', data.counts?.expected_zero ?? 0],
        ['Approved expected zero', data.counts?.approved_expected_zero ?? 0],
        ['Approved candidate queries', data.counts?.approved_candidate_queries ?? 0],
        ['Learning queue', data.counts?.learning_queue ?? 0],
      ];
      stats.forEach(([label, value]) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<h2>${label}</h2><div class="stat">${value}</div><div class="muted">Live from reports.</div>`;
        cards.appendChild(card);
      });
      const summaryText = document.getElementById('summaryText');
      summaryText.textContent = JSON.stringify(data.summary || {}, null, 2);
      const queueList = document.getElementById('queueList');
      const queue = Array.isArray(data.learning_queue) ? data.learning_queue : [];
      queueList.innerHTML = queue.length ? `<ul class="list">${queue.slice(0, 10).map(item => `<li>${JSON.stringify(item)}</li>`).join('')}</ul>` : '<p class="muted">No learning queue data yet.</p>';
    }
    loadDashboard();
  </script>
</body>
</html>

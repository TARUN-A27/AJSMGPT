<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutomateQuery NLP Review</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101a2a; --panel-2:#15233a; --text:#f4f7fb; --muted:#8ca1b9; --accent:#5eead4; --border:#25364d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    header { padding:24px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; }
    main { max-width:1280px; margin:0 auto; padding:24px 28px 60px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px; }
    .card h2 { margin-top:0; font-size:18px; }
    .muted { color:var(--muted); font-size:13px; }
    pre { white-space:pre-wrap; word-break:break-word; background:#050b12; border:1px solid var(--border); border-radius:12px; padding:14px; overflow:auto; font-size:12px; color:#dce8f7; }
    .row { border:1px solid var(--border); border-radius:12px; padding:12px; margin:10px 0; background:#0f1b2d; }
    input, textarea, button { width:100%; margin-top:8px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0f1b2d; color:var(--text); }
    button { background:var(--accent); color:#051018; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>NLP Review</h1>
      <div class="muted">Inspect NLU data and save review feedback without touching production routers.</div>
    </div>
    <a href="/dashboard">Back to Dashboard</a>
  </header>
  <main>
    <div class="card">
      <h2>Submit a review</h2>
      <input id="questionInput" placeholder="Question" />
      <textarea id="noteInput" rows="4" placeholder="Feedback"></textarea>
      <button onclick="saveFeedback()">Save feedback</button>
      <div id="feedbackStatus" class="muted" style="margin-top:8px;"></div>
    </div>
    <div class="card">
      <h2>NLU files</h2>
      <div id="nluFiles"></div>
    </div>
    <div class="card">
      <h2>Feedback log</h2>
      <div id="feedbackLog"></div>
    </div>
  </main>
  <script>
    async function loadNlpReview() {
      const res = await fetch('/api/nlp-review/questions');
      const data = await res.json();
      const files = document.getElementById('nluFiles');
      files.innerHTML = ['nlu','nlu_priority','nlu_generated','intent_templates'].map(key => `
        <div class="row">
          <strong>${key}</strong>
          <pre>${escapeHtml(data[key] || '')}</pre>
        </div>
      `).join('');
      const feedbackLog = document.getElementById('feedbackLog');
      const rows = Array.isArray(data.feedback) ? data.feedback : [];
      feedbackLog.innerHTML = rows.length ? rows.map(item => `<div class="row">${escapeHtml(JSON.stringify(item, null, 2))}</div>`).join('') : '<p class="muted">No feedback yet.</p>';
    }
    async function saveFeedback() {
      const res = await fetch('/api/nlp-review/save-feedback', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          question: document.getElementById('questionInput').value,
          note: document.getElementById('noteInput').value,
          is_correct: true,
        })
      });
      const data = await res.json();
      document.getElementById('feedbackStatus').textContent = data.success ? 'Feedback saved.' : data.error || 'Unable to save feedback.';
      if (data.success) loadNlpReview();
    }
    function escapeHtml(value) { return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }
    loadNlpReview();
  </script>
</body>
</html>

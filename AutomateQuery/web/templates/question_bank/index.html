<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutomateQuery Question Bank</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101a2a; --panel-2:#15233a; --text:#f4f7fb; --muted:#8ca1b9; --accent:#5eead4; --border:#25364d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    header { padding:24px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; }
    main { max-width:1280px; margin:0 auto; padding:24px 28px 60px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:16px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px; }
    .card h2 { margin-top:0; font-size:18px; }
    .muted { color:var(--muted); font-size:13px; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted); margin:0 6px 6px 0; font-size:12px; }
    pre { white-space:pre-wrap; word-break:break-word; background:#050b12; border:1px solid var(--border); border-radius:12px; padding:14px; overflow:auto; font-size:12px; color:#dce8f7; }
    .row { border:1px solid var(--border); border-radius:12px; padding:12px; margin:10px 0; background:#0f1b2d; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Question Bank</h1>
      <div class="muted">Live learning queue, regression candidates, retest, diagnosis, and expected-zero cases.</div>
    </div>
    <a href="/dashboard">Back to Dashboard</a>
  </header>
  <main>
    <section class="grid" id="stats"></section>
    <section class="card">
      <h2>Queue</h2>
      <div id="queue"></div>
    </section>
    <section class="card">
      <h2>Regression candidates</h2>
      <div id="regression"></div>
    </section>
    <section class="card">
      <h2>Expected zero</h2>
      <div id="expectedZero"></div>
    </section>
  </main>
  <script>
    async function loadBank() {
      const res = await fetch('/api/question-bank');
      const data = await res.json();
      document.getElementById('stats').innerHTML = Object.entries(data.counts || {}).map(([label, value]) => `
        <div class="card">
          <h2>${label}</h2>
          <div style="font-size:32px;font-weight:700;">${value}</div>
          <div class="muted">From the contract-backed reports.</div>
        </div>
      `).join('');
      document.getElementById('queue').innerHTML = renderRows(data.queue);
      document.getElementById('regression').innerHTML = renderRows(data.regression_candidates);
      document.getElementById('expectedZero').innerHTML = renderRows(data.expected_zero);
    }
    function renderRows(rows) {
      if (!Array.isArray(rows) || !rows.length) return '<p class="muted">No rows available yet.</p>';
      return rows.slice(0, 15).map(item => `<div class="row">${escapeHtml(JSON.stringify(item, null, 2))}</div>`).join('');
    }
    function escapeHtml(value) { return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }
    loadBank();
  </script>
</body>
</html>

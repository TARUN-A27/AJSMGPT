<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutomateQuery Question Bank</title>
  <style>
    :root { color-scheme: dark; --bg:#09090b; --panel:#121217; --panel-2:#181821; --text:#f5f5f7; --muted:#a1a1aa; --border:#2a2a2f; --ok:#86efac; --warn:#fde68a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { border-bottom:1px solid var(--border); padding:24px; position:sticky; top:0; background:rgba(9,9,11,0.95); backdrop-filter:blur(8px); z-index:10; }
    main { max-width: 1320px; margin:0 auto; padding:24px; }
    .intro { color:var(--muted); margin-top:8px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .back { color:#c4b5fd; text-decoration:none; font-weight:600; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:18px 0; }
    .summary-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
    .summary-box strong { display:block; font-size:1.25rem; margin-bottom:4px; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0 8px; }
    input, select { background:#17171c; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; }
    input { min-width:280px; }
    table { width:100%; border-collapse:collapse; overflow:hidden; border-radius:14px; background:var(--panel); border:1px solid var(--border); }
    th, td { padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { background:var(--panel-2); color:var(--muted); font-size:0.84rem; text-transform:uppercase; letter-spacing:0.04em; }
    .tag { display:inline-block; padding:4px 8px; border-radius:999px; background:#1f2937; color:#cbd5e1; font-size:0.8rem; margin:2px 4px 2px 0; }
    .tag.ok { color:#052e16; background:var(--ok); }
    .tag.warn { color:#422006; background:var(--warn); }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size:0.9rem; }
    .muted { color:var(--muted); }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    a { color:#c4b5fd; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Question Bank</h1>
        <div class="intro">Browse the collected question inventory, grouped by category and review state.</div>
      </div>
      <a class="back" href="/dashboard">Back to Dashboard</a>
    </div>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <input id="search" placeholder="Search questions, categories, sources..." />
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="review">Needs review</option>
        <option value="ok">OK</option>
      </select>
      <select id="categoryFilter">
        <option value="">All categories</option>
      </select>
    </div>
    <div id="tableWrap"></div>
  </main>
  <script>
    let ITEMS = [];
    const summaryEl = document.getElementById('summary');
    const tableWrap = document.getElementById('tableWrap');
    const searchEl = document.getElementById('search');
    const statusFilterEl = document.getElementById('statusFilter');
    const categoryFilterEl = document.getElementById('categoryFilter');

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    async function loadData() {
      const res = await fetch('/api/question-bank');
      const data = await res.json();
      ITEMS = data.items || [];
      renderSummary(data);
      renderCategories();
      renderTable();
    }

    function renderSummary(data) {
      const items = [
        ['Unique Questions', data.total || 0],
        ['Need Review', data.review_count || 0],
        ['OK', data.ok_count || 0],
      ];
      const categories = data.category_counts || [];
      summaryEl.innerHTML = items.map(([label, value]) => `<div class="summary-box"><strong>${value}</strong>${label}</div>`).join('') + categories.map(([category, count]) => `<div class="summary-box"><strong>${count}</strong>${escapeHtml(category)}</div>`).join('');
    }

    function renderCategories() {
      const categories = [...new Set(ITEMS.map(item => String(item.category || 'unknown')))].sort();
      categoryFilterEl.innerHTML = '<option value="">All categories</option>' + categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
    }

    function getFilteredItems() {
      const search = searchEl.value.toLowerCase();
      const status = statusFilterEl.value;
      const category = categoryFilterEl.value;
      return ITEMS.filter(item => {
        const categoryValue = String(item.category || 'unknown');
        const statusValue = item.needs_review ? 'review' : 'ok';
        const haystack = [item.question, categoryValue, item.router_sources_seen, item.intents_seen, item.category].join(' ').toLowerCase();
        const matchesSearch = !search || haystack.includes(search);
        const matchesStatus = !status || statusValue === status;
        const matchesCategory = !category || categoryValue === category;
        return matchesSearch && matchesStatus && matchesCategory;
      });
    }

    function renderTable() {
      const rows = getFilteredItems();
      if (!rows.length) {
        tableWrap.innerHTML = '<div class="empty">No questions matched the current filters.</div>';
        return;
      }
      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Category</th>
              <th>Question</th>
              <th>Count</th>
              <th>Status</th>
              <th>Fallback</th>
              <th>Failed</th>
              <th>Slow</th>
              <th>Sources Seen</th>
              <th>Intents Seen</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((item, index) => {
              const status = item.needs_review ? 'review' : 'ok';
              const label = item.needs_review ? 'REVIEW' : 'OK';
              const className = item.needs_review ? 'warn' : 'ok';
              return `
                <tr>
                  <td>${index + 1}</td>
                  <td><span class="tag">${escapeHtml(item.category || 'unknown')}</span></td>
                  <td>${escapeHtml(item.question || '')}</td>
                  <td>${escapeHtml(item.occurrence_count ?? '')}</td>
                  <td><span class="tag ${className}">${label}</span></td>
                  <td>${escapeHtml(item.fallback_count ?? 0)}</td>
                  <td>${escapeHtml(item.failed_count ?? 0)}</td>
                  <td>${escapeHtml(item.slow_count ?? 0)}</td>
                  <td><span class="mono">${escapeHtml(item.router_sources_seen || '')}</span></td>
                  <td><span class="mono">${escapeHtml(item.intents_seen || '')}</span></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    [searchEl, statusFilterEl, categoryFilterEl].forEach(el => el.addEventListener('input', renderTable));
    [searchEl, statusFilterEl, categoryFilterEl].forEach(el => el.addEventListener('change', renderTable));
    loadData();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutomateQuery Router Candidates</title>
  <style>
    :root { color-scheme: dark; --bg:#09090b; --panel:#121217; --panel-2:#181821; --text:#f5f5f7; --muted:#a1a1aa; --border:#2a2a2f; --danger:#fca5a5; --accent:#8b5cf6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { border-bottom:1px solid var(--border); padding:24px; position:sticky; top:0; background:rgba(9,9,11,0.95); backdrop-filter:blur(8px); z-index:10; }
    main { max-width: 1320px; margin:0 auto; padding:24px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .intro { color:var(--muted); margin-top:8px; }
    .back { color:#c4b5fd; text-decoration:none; font-weight:600; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:18px 0; }
    .summary-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
    .summary-box strong { display:block; font-size:1.25rem; margin-bottom:4px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
    input, select { background:#17171c; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; }
    input { min-width:280px; }
    .candidate-card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px; margin:16px 0; }
    .candidate-top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
    .candidate-id { background:#1f2937; padding:4px 8px; border-radius:999px; color:#cbd5e1; font-size:0.82rem; }
    .source { color:var(--muted); }
    .meta-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin:10px 0 12px; }
    .meta-grid > div { background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:10px; }
    .meta-grid label { display:block; color:var(--muted); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
    .tag { display:inline-block; padding:4px 8px; border-radius:999px; background:#1f2937; color:#cbd5e1; font-size:0.8rem; margin:2px 4px 2px 0; }
    .tag.danger { background:#4c1d1d; color:var(--danger); }
    pre { background:#0f0f10; border:1px solid var(--border); border-radius:10px; padding:12px; white-space:pre-wrap; overflow-x:auto; color:#e4e4e7; }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    a { color:#c4b5fd; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Router Candidates</h1>
        <div class="intro">Inspect router fallback, wrong-table, slow, and zero-row findings with the suggested fix details.</div>
      </div>
      <a class="back" href="/dashboard">Back to Dashboard</a>
    </div>
  </header>
  <main>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <input id="search" placeholder="Search questions, sources, tables, intents..." />
      <select id="filterType">
        <option value="">All candidate types</option>
        <option value="fallback">Fallback used</option>
        <option value="wrong-table">Wrong table</option>
        <option value="review-required">Review required</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
  <script>
    let ITEMS = [];
    const summaryEl = document.getElementById('summary');
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const filterTypeEl = document.getElementById('filterType');

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    async function loadData() {
      const res = await fetch('/api/router-candidates');
      const data = await res.json();
      ITEMS = data.candidates || [];
      renderSummary(data);
      renderList();
    }

    function renderSummary(data) {
      summaryEl.innerHTML = [
        ['Total Candidates', data.total || 0],
        ['Review Required', data.review_required || 0],
        ['Wrong Table', data.wrong_table_count || 0],
        ['Fallback Used', data.fallback_count || 0],
      ].map(([label, value]) => `<div class="summary-box"><strong>${value}</strong>${label}</div>`).join('');
    }

    function getFilteredItems() {
      const search = searchEl.value.toLowerCase();
      const type = filterTypeEl.value;
      return ITEMS.filter(item => {
        const problems = (item.problem_types || []).join(' ').toLowerCase();
        const wrongTables = (item.wrong_tables_detected || []).join(' ').toLowerCase();
        const suggestion = item.suggestion || {};
        const haystack = [item.candidate_id, item.question, item.source, problems, wrongTables, suggestion.target_router_file, suggestion.suggested_intent_name].join(' ').toLowerCase();
        const matchesSearch = !search || haystack.includes(search);
        const matchesType = !type || (type === 'fallback' && problems.includes('fallback_used')) || (type === 'wrong-table' && wrongTables) || (type === 'review-required' && suggestion.suggested_intent_name === 'REVIEW_REQUIRED');
        return matchesSearch && matchesType;
      });
    }

    function renderList() {
      const rows = getFilteredItems();
      if (!rows.length) {
        listEl.innerHTML = '<div class="empty">No router candidates matched the current filters.</div>';
        return;
      }
      listEl.innerHTML = rows.map(item => {
        const suggestion = item.suggestion || {};
        const problems = item.problem_types || [];
        const wrongTables = item.wrong_tables_detected || [];
        return `
          <div class="candidate-card">
            <div class="candidate-top">
              <span class="candidate-id">${escapeHtml(item.candidate_id || '')}</span>
              <span class="source">${escapeHtml(item.source || '')}</span>
            </div>
            <h2>${escapeHtml(item.question || '')}</h2>
            <div class="meta-grid">
              <div><label>Success</label><div>${escapeHtml(item.success ?? '')}</div></div>
              <div><label>Rows</label><div>${escapeHtml(item.row_count ?? '')}</div></div>
              <div><label>Elapsed MS</label><div>${escapeHtml(item.elapsed_ms ?? '')}</div></div>
              <div><label>Similar Count</label><div>${escapeHtml(item.similar_question_count ?? '')}</div></div>
            </div>
            <h3>Problems</h3>
            <div>${problems.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join('')}</div>
            <h3>Wrong Tables Detected</h3>
            <div>${wrongTables.length ? wrongTables.map(t => `<span class="tag danger">${escapeHtml(t)}</span>`).join('') : '<span class="muted">None</span>'}</div>
            <h3>Suggested Fix</h3>
            <div class="meta-grid">
              <div><label>Target Router</label><div>${escapeHtml(suggestion.target_router_file || '')}</div></div>
              <div><label>Suggested Intent</label><div>${escapeHtml(suggestion.suggested_intent_name || '')}</div></div>
            </div>
            <p><strong>SQL Template Pattern</strong></p>
            <pre>${escapeHtml(suggestion.suggested_sql_template_pattern || '')}</pre>
            <details>
              <summary>Show logged SQL / fallback SQL</summary>
              <pre>${escapeHtml(item.sql || '')}</pre>
            </details>
          </div>`;
      }).join('');
    }

    [searchEl, filterTypeEl].forEach(el => el.addEventListener('input', renderList));
    [searchEl, filterTypeEl].forEach(el => el.addEventListener('change', renderList));
    loadData();
  </script>
</body>
</html>
